// ---------- time remap (tape stutter) ----------
function sceneTime(t) {
  const fr = Math.round(t * FPS);
  if (fr < 30) return Math.floor(fr / 2) * 2 / FPS;                                   // 15 fps while tracking
  const r0 = Math.round(CUES.tape_rewind[0] * FPS), r1 = Math.round(CUES.tape_rewind[1] * FPS), s0 = Math.round(CUES.slam * FPS);
  if (fr >= r0 && fr < r1) return (r0 - 1 - (fr - r0)) / FPS;                          // 2 frames backwards
  if (fr >= r1 && fr < s0) return Math.floor(fr / 2) * 2 / FPS;                        // 15 fps drag
  const st = Math.round(CUES.stop * FPS);
  if (fr >= st) return CUES.stop + (Math.floor(fr / 2) * 2 - st) / FPS * .5;           // STOP: tape winds down
  return fr >= s0 ? Math.max(t, CUES.slam) : t;
}
// ---------- camera path (precomputed from speed curve) ----------
function speed(t) {
  if (t < 1.0) return 18 + 4 * t;
  if (t < 2.0) return 22 + 26 * smooth(t - 1);
  if (t < 2.6) return 48;
  if (t < 3.8) return 48 + 13 * smooth((t - 2.6) / 1.2);     // surge into the tape drag
  if (t < CUES.slam) return 61 - 35 * smooth((t - 3.8) / 0.4);
  return 34 + 30 * Math.exp(-(t - CUES.slam) * 2.4);
}

const camZ = t => { const f = clamp(t, 0, 10.5) / DT, i = Math.floor(f), k = f - i; return lerp(ZT[i], ZT[i + 1], k); };

console.log('S1 cues');
// ---------- fonts ----------
await document.fonts.load("italic 900 expanded 100px Archivo");
await document.fonts.load("italic 900 100px Archivo");

const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(1); composer.setSize(W * DPR, H * DPR);

const SHIFT = 75;                       // horizon at y = 540 + SHIFT (shift-lens, verticals stay vertical)
const FOV = 50, FPX = (H / 2) / Math.tan(FOV / 2 * Math.PI / 180);
const HORIZON = H / 2 + SHIFT;
const cam = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 4000);
cam.setViewOffset(W, H, 0, -SHIFT, W, H);
cam.rotation.order = 'YXZ';
const scene = new THREE.Scene();

const HAZE = new THREE.Vector3(1.0, 0.24, 0.55);
const U = { uTime: { value: 0 }, uFrame: { value: 0 }, uPulseAge: { value: 99 }, uPulse: { value: 0 }, uLift: { value: 0 },
  uHaze: { value: HAZE }, uShoot: { value: -1 }, uBlur: { value: 0 }, uTLl: { value: new THREE.Vector3(0, -9, 0) }, uTLr: { value: new THREE.Vector3(0, -9, 0) }, uCarI: { value: 0 } };

// ---------- sky ----------
const skyMat = new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false, depthTest: false,
  vertexShader: `varying vec3 vW; void main(){ vW = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader: `
  varying vec3 vW; uniform float uFrame, uLift, uShoot; uniform vec3 uHaze;
  float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

    float pxa = e / max(fwidth(e), 1e-6);                 // px above the horizon

    c = mix(c, vec3(.30,.05,.40), smoothstep(.015, .13, e));
    c = mix(c, vec3(.10,.025,.24), smoothstep(.10, .28, e));
    c = mix(c, vec3(.022,.006,.07), smoothstep(.24, .50, e));
    float upx = max(pxa, 0.);

    c = pxa < 0. ? uHaze * .45 : c;
    c += vec3(1., .82, .96) * exp(-pxa * pxa / 2.2) * 1.25;   // hot horizon line
    // stars
    vec2 sp = vec2(atan(d.x, -d.z), asin(clamp(e,-1.,1.))) * 70.;
    vec2 id = floor(sp), f = fract(sp) - .5;
    float h = h21(id);

    float pxs = max(fwidth(sp.x), 1e-4);            // cell units per pixel
    float r = length(f - jit*.7) / pxs;              // pixels from star centre
    float tw = .65 + .35*sin(uFrame*.37*(1.+h*3.) + h*40.);
    float big = step(.994, h);
    float star = step(.88, h) * exp(-r*r/(big>0.? 1.9:0.7)) * (0.35 + 0.65*fract(h*91.)) * tw;
    vec2 fr = abs((f - jit*.7)/pxs);

    star *= smoothstep(.04, .16, e);
    c += vec3(.95,.9,1.) * star * 1.7;

      vec2 A = vec2(-.62, .40), B = vec2(-.30, .30);
      vec2 hd = mix(A, B, uShoot), dir = normalize(B - A);
      vec2 tl = hd - dir * .10 * sin(3.14159*uShoot);
      float dd = segd(q, tl, hd) / max(fwidth(q.x),1e-5);
      float along = clamp(dot(q - tl, dir) / .10, 0., 1.);
      c += vec3(.8,.95,1.) * exp(-dd*dd*.35) * along * sin(3.14159*uShoot) * 1.2;

  }`

const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 64, 32), skyMat); sky.renderOrder = -10; scene.add(sky);

// ---------- sun ----------
const SUN_D = 1150, SUN_RPX = 250, SUN_R = SUN_RPX / FPX * SUN_D;
const sunMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({ uSunTime: { value: 0 } }, U), transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  vertexShader: `varying vec2 vP; void main(){ vP = position.xy / ${SUN_R.toFixed(3)}; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
  varying vec2 vP; uniform float uSunTime, uLift;
  void main(){
    float r = length(vP);
    float aa = fwidth(r) * 1.2;
    float disc = 1. - smoothstep(1. - aa, 1. + aa, r);
    float y = vP.y;
    vec3 c = mix(vec3(1.,.24,.56), vec3(1.,.40,.28), smoothstep(-1., -.25, y));
    c = mix(c, vec3(1.,.62,.22), smoothstep(-.3, .25, y));
    c = mix(c, vec3(1.,.86,.36), smoothstep(.15, .65, y));
    c = mix(c, vec3(1.,.96,.62), smoothstep(.6, 1., y));
    // band cut-outs: widen toward the bottom, scroll downward
    float w = .38 - y;
    float ph = w * 8.5 - uSunTime * .55;
    float gapF = clamp(w * .42, 0., .62) * step(0., w);
    float fp = fract(ph);
    float afw = fwidth(ph) * 1.2;
    float gap = smoothstep(gapF + afw, gapF - afw, fp) * step(.001, gapF);
    float a = disc * (1. - gap);
    vec3 halo = vec3(1.,.28,.52) * (exp(-max(r-1.,0.)*3.2)*.30 + exp(-max(r-1.,0.)*.9)*.10) * (1.-disc*(1.-gap)) * (1.+uLift*.6);
    gl_FragColor = vec4(c * a * (.84 + uLift*.14) + halo, a);
  }`
});
const sun = new THREE.Mesh(new THREE.PlaneGeometry(SUN_R * 5, SUN_R * 5), sunMat); sun.renderOrder = -5; scene.add(sun);

// ---------- mountains ----------
const noise2 = createNoise2D(mulberry32(1986));
function ridged(x, z) { let s = 0, a = .55, f = 1; for (let o = 0; o < 5; o++) { s += a * (1 - Math.abs(noise2(x * f, z * f))); a *= .5; f *= 2.03; } return s; }
const MG = new THREE.PlaneGeometry(1900, 380, 95, 19); MG.rotateX(-Math.PI / 2);
{ const p = MG.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); const ax = Math.abs(x);
    const env = smooth((ax - 150) / 380) * (0.45 + 0.55 * smooth((-z + 190) / 380));
    const h = env * (18 + 150 * Math.pow(ridged(x * .0042 + 3.1, z * .006), 1.6) * .75);
    p.setY(i, Math.max(0, h)); } MG.computeVertexNormals(); }
const mtMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec2 vUv; varying float vH; varying vec3 vW; void main(){ vUv = uv; vH = position.y; vW = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
  varying vec2 vUv; varying float vH; varying vec3 vW; uniform vec3 uHaze; uniform float uLift;
  void main(){
    vec2 g = vUv * vec2(95., 19.);
    vec2 fw = max(fwidth(g), 1e-4);
    vec2 d = abs(fract(g - .5) - .5) / fw;
    float gd = g.x + g.y; float dd = abs(fract(gd - .5) - .5) / max(fwidth(gd),1e-4);
    float m = min(min(d.x, d.y), dd);
    float core = 1. - smoothstep(.25, 1.1, m);
    float glow = exp(-m / 2.2);
    float h = clamp(vH / 120., 0., 1.);
    vec3 fill = mix(vec3(.05,.0,.12), vec3(.10,.02,.20), h);
    vec3 wire = mix(vec3(1.,.18,.80), vec3(.22,.88,1.), smoothstep(.12, .7, h));
    vec3 c = fill + wire * (core * .85 + glow * .22) * (1. + uLift*.4);
    c = mix(c, uHaze * .55, exp(-vH / 9.) * .62);
    vec3 v = normalize(vW - cameraPosition); float pxb = max(-v.y / max(fwidth(v.y), 1e-6), 0.);
    c += (vec3(1., .82, .96) * exp(-pxb*pxb / 2.2) * 1.25 + uHaze * exp(-pxb / 14.) * .45) * (1. - smoothstep(0., 3., vH));
    gl_FragColor = vec4(c, 1.);
  }`
});
const mountains = new THREE.Mesh(MG, mtMat); scene.add(mountains);

// ---------- floor grid ----------
const floorMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `varying vec3 vW; void main(){ vW = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader: `
  varying vec3 vW; uniform vec3 uHaze, uTLl, uTLr; uniform float uPulseAge, uPulse, uLift, uBlur, uCarI, uTime;
  float streak(vec3 v, vec3 L, float wz){ vec3 l = normalize(L - cameraPosition); float de = l.y - v.y;      // de > 0: below the contact line
    float da = atan(v.x, -v.z) - atan(l.x, -l.z) + .0035 * sin(wz * 1.9 + uTime * 5.) * min(max(de, 0.) * 10., 1.);
    float sg = .0048 + max(de, 0.) * .04;
    return exp(-da*da / (2.*sg*sg)) * exp(-max(de, 0.) * 5.) * smoothstep(-.001, .01, de); }
  void main(){
    vec2 p = vW.xz / vec2(2.5, 5.0) + vec2(.5, 0.);
    vec2 fw = max(fwidth(p), 1e-5);
    vec2 fb = fw + vec2(0., uBlur);                       // transverse lines smeared by this sample's travel (no strobing)
    vec2 d = abs(fract(p - .5) - .5) / fb;
    vec2 fade = 1. - smoothstep(.10, .42, fw);
    float eC = max(1.5 * fw.y / (1.5 * fw.y + uBlur), .12), eG = max(6.8 * fw.y / (6.8 * fw.y + uBlur), .10);   // energy-conserving smear
    vec2 core = (1. - smoothstep(.3, 1.35, d)) * fade * vec2(1., eC);
    vec2 glow = (exp(-d / 3.4) + exp(-d / 15.) * .16) * fade * vec2(1., eG);
    float line = max(core.x, core.y);
    float gl = max(glow.x, glow.y);
    float dist = length(vW.xz - cameraPosition.xz);
    vec3 lc = vec3(1., .16, .82);
    vec3 base = mix(vec3(.018,.0,.05), vec3(.09,.01,.15), smoothstep(30., 700., dist));
    float wave = exp(-abs(dist - uPulseAge * 240.) / 10.) * exp(-uPulseAge * 1.3) * uPulse;
    float pump = 1. + .30 * exp(-uPulseAge * 7.) * min(uPulse * 2., 1.) + min(uLift * .35, .10);
    vec3 c = base + lc * gl * .50 * pump + mix(lc, vec3(1.,.85,.97), .5) * line * pump;
    c += lc * (line * 1.6 + gl * 1.0) * wave;
    vec3 v = normalize(vW - cameraPosition);
    float pxb = max(-v.y / max(fwidth(v.y), 1e-6), 0.);   // px below the horizon
    // car: contact shadow, red road glow behind it, tail-light streaks on the glossy floor
    vec2 mid = vec2((uTLl.x + uTLr.x) * .5, uTLl.z);
    vec2 cs = vW.xz - (mid + vec2(0., -2.25));
    c *= 1. - .85 * exp(-(cs.x*cs.x / 1.3 + cs.y*cs.y / 6.)) * min(uCarI, 1.);
    vec2 cp = vW.xz - (mid + vec2(0., 1.6));
    c += vec3(1., .08, .22) * exp(-(cp.x*cp.x / 1.4 + cp.y*cp.y / 7.)) * uCarI * .22;
    float brk = .3 + .7 * smoothstep(.02, .14, abs(fract(p.y - .5) - .5));        // broken by the transverse lines
    float wrip = .35 + .65 * smoothstep(.25, .85, .5 + .5 * sin(vW.z * 5.5 + uTime * 3.));     // wet-road ripple dashes
    c += vec3(1., .10, .16) * (streak(v, uTLl, vW.z) + streak(v, uTLr, vW.z)) * brk * wrip * .55 * uCarI / (1. + .3 * uCarI);
    // banded sun: a rippling vertical reflection streak down the floor centre
    float az = atan(v.x, -v.z);
    float rip = .55 + .45 * smoothstep(-.3, .7, sin(pxb * .42 - uTime * 7.));
    float refl = exp(-az*az / .006) * exp(-pxb / 150.) * rip;
    vec2 far = (1. - fade) * min(vec2(1.), fw * 3.2);            // lines that merged: keep their mean light (clamped)
    c += lc * min((far.x * .5 + far.y) * .30 * pump, .22);
    float fog = smoothstep(150., 950., dist);
    c = mix(c, uHaze * .55, fog * .70);
    c = mix(c, vec3(.102, .024, .188), (smoothstep(3., 8., pxb) - smoothstep(18., 30., pxb)) * .85);   // dark band: the horizon reads as a line
    c += vec3(1., .42, .35) * refl * .62 * (1. + min(uLift, .2) * .5);
    c += vec3(1., .82, .96) * exp(-pxb*pxb / 2.2) * 1.25 + uHaze * (exp(-pxb / 3.2) * .40 + exp(-pxb / 60.) * .05);
    gl_FragColor = vec4(c, 1.);
  }`
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), floorMat); floor.rotation.x = -Math.PI / 2; scene.add(floor);
// v5 ?nolink=dot: no sun (disc + halo) and no sun streak on the floor; ?nolink=horizon: no hot 2 px horizon line

  if (NOLINK.has('dot')) { sun.visible = false; sub(floorMat, 'c += vec3(1., .42, .35) * refl', 'c += vec3(0.) * refl'); }
  if (NOLINK.has('horizon')) { sub(skyMat, 'vec3(1., .82, .96) * exp(-pxa * pxa / 2.2) * 1.25', 'vec3(0.)');
    for (const m of [mtMat, floorMat]) sub(m, 'vec3(1., .82, .96) * exp(-pxb*pxb / 2.2) * 1.25', 'vec3(0.)'); } }

console.log('S3 scene');
// ---------- palms ----------
function makePalmTexture(seed, rimDir) {
  const PW = 900, PH = 1800, c = document.createElement('canvas'); c.width = PW; c.height = PH;
  const g = c.getContext('2d');
  const passes = [[rimDir * PW * .011, 'rgb(255,60,185)'], [0, '#0a0118']];
  for (const [dx, col] of passes) {
    const r = mulberry32(seed);
    g.fillStyle = col; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
    const lean = (r() - .5) * PW * .22 - rimDir * PW * .08;
    const bx = PW * .5 + dx - lean * .3, by = PH, tx = PW * .5 + lean + dx, ty = PH * .31, cx = PW * .5 + dx - lean * .1, cy = PH * .72;
    const pt = k => [(1 - k) * (1 - k) * bx + 2 * (1 - k) * k * cx + k * k * tx, (1 - k) * (1 - k) * by + 2 * (1 - k) * k * cy + k * k * ty];
    const N = 90, L = [], R = [];
    for (let i = 0; i <= N; i++) { const k = i / N, [x, y] = pt(k), [x2, y2] = pt(Math.min(1, k + .01)); let nx = -(y2 - y), ny = x2 - x; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      const wdt = lerp(PW * .036, PW * .019, k) * (1 + .10 * Math.max(0, Math.sin(k * 140))); L.push([x + nx * wdt, y + ny * wdt]); R.push([x - nx * wdt, y - ny * wdt]); }
    g.beginPath(); g.moveTo(...L[0]); L.forEach(p => g.lineTo(...p)); R.reverse().forEach(p => g.lineTo(...p)); g.closePath(); g.fill();
    const NF = 12;
    for (let f = 0; f < NF; f++) {
      const a = -Math.PI * 1.02 + (f / (NF - 1)) * Math.PI * 1.04 + (r() - .5) * .22;
      const len = PW * (.36 + r() * .16);
      const droop = PW * (.18 + r() * .22) * (0.35 + 0.65 * Math.abs(Math.cos(a)));
