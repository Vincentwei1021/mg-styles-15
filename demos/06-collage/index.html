// ------------------------------------------------------------------ helpers
const PI = Math.PI, DEG = PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

// slap: a piece drops from "camera" onto the page, hitting exactly on t0 (squash on impact, shadow collapses)
function slap(t, t0, pre = 3) {

  c.beginPath();

// paper fibre / dust flecks puffing out of an impact for 2 steps (k = 0, 1). pts: [x, y, dirx, diry]
function flecks(c, pts, k, seed, n = 6) {
  if (k < 0 || k > 1) return;

  for (let i = 0; i < n; i++) {

// ------------------------------------------------------------------ portrait rig (local coords = piece px)

const OFF = [845 - PL.head_center[0], 554 - PL.head_center[1]];   // local -> main-page screen (at rest)
const CUT = PL.cut, JAWH = PL.jaw_hinge;

const WEDGE_BASE = [PL.head_center[0], LAY.space_wedge.anchor[1] + LAY.space_wedge.y0 - OFF[1]];
const alphaOf = img => { const c = off(PW, PH), x = c.getContext('2d'); x.drawImage(img, 0, 0); return x.getImageData(0, 0, PW, PH).data; };
const AL = alphaOf(I.p_lid), AF = alphaOf(I.p_face), AJ = alphaOf(I.p_jaw);
const ext = (A, dy) => { let a = 1e9, b = -1e9; for (let x = 0; x < PW; x++) { const y = Math.round(cutY(x) + dy); if (y >= 0 && y < PH && A[(y * PW + x) * 4 + 3] > 128) { a = Math.min(a, x); b = Math.max(b, x); } } return [a, b]; };
const LX = ext(AL, -5), FX = ext(AF, 5);
const HG = [LX[0] + 26, cutY(LX[0] + 26) - 7];                    // lid hinge = brass brad at the temple
// jaw top edge (the scissor cut between moustache and beard), sampled every 4 px
const JEDGE = []; for (let x = 216; x <= 544; x += 4) { for (let y = 430; y < 700; y++) if (AJ[(y * PW + x) * 4 + 3] > 128) { JEDGE.push([x, y]); break; } }
const edgeAt = x => { let best = JEDGE[0]; for (const p of JEDGE) if (Math.abs(p[0] - x) < Math.abs(best[0] - x)) best = p; return best[1]; };
// jaw with a faceted white scissor rim on its upper cut
const cJaw = off(PW, PH); { const x = cJaw.getContext('2d'); const fac = JEDGE.filter((_, i) => i % 6 === 0).concat([JEDGE[JEDGE.length - 1]]);
  x.lineJoin = 'miter'; x.strokeStyle = '#F4EFE4'; x.lineWidth = 11; x.beginPath(); fac.forEach(([px, py], i) => i ? x.lineTo(px, py - 1) : x.moveTo(px, py - 1)); x.stroke();
  x.drawImage(I.p_jaw, 0, 0); }
// mouth cavity: jaw silhouette at rest, near-black with a throat glow, a teeth strip under the lip and a 10 px inner shadow
const cCav = off(PW, PH); { const x = cCav.getContext('2d'); x.drawImage(I.p_jaw, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#0E0B08'; x.fillRect(0, 0, PW, PH);
  x.globalCompositeOperation = 'source-atop';
  const g = x.createRadialGradient(390, 575, 8, 390, 575, 120); g.addColorStop(0, 'rgba(96,26,20,.85)'); g.addColorStop(1, 'rgba(96,26,20,0)'); x.fillStyle = g; x.fillRect(0, 0, PW, PH);
  x.beginPath(); for (let px = 276; px <= 474; px += 6) x.lineTo(px, edgeAt(px) + 2); for (let px = 474; px >= 276; px -= 6) x.lineTo(px, edgeAt(px) + 17); x.closePath(); x.fillStyle = '#E4DAC4'; x.fill();
  x.strokeStyle = 'rgba(14,11,8,.75)'; x.lineWidth = 2.2; for (let px = 290; px < 474; px += 21) { x.beginPath(); x.moveTo(px, edgeAt(px) + 4); x.lineTo(px + 1, edgeAt(px) + 17); x.stroke(); }
  x.shadowColor = 'rgba(0,0,0,.9)'; x.shadowBlur = 10; x.strokeStyle = 'rgba(8,6,4,.9)'; x.lineWidth = 7;
  x.beginPath(); JEDGE.forEach(([px, py], i) => i ? x.lineTo(px, py - 3) : x.moveTo(px, py - 3)); x.stroke(); }
const cLid = off(PW, PH), cFace = off(PW, PH);
const xLid = cLid.getContext('2d'), xFace = cFace.getContext('2d');
const cutPath = (cx, x0, x1, dy0, dy1) => { cx.beginPath(); for (let x = x0; x <= x1; x += 8) cx.lineTo(x, cutY(x) + dy0); for (let x = x1; x >= x0; x -= 8) cx.lineTo(x, cutY(x) + dy1); cx.closePath(); };
// print dashed coupon line, the snipped gap and (after the POP) the skull-band cut edge onto lid & face
function bakeHead(stamp, snipX, band) {
  for (const [cx, img, isLid] of [[xLid, I.p_lid, 1], [xFace, I.p_face, 0]]) {
    cx.globalCompositeOperation = 'source-over'; cx.clearRect(0, 0, PW, PH); if (isLid) cx.drawImage(LIDR, -LIDR.pad, -LIDR.pad); else cx.drawImage(img, 0, 0);

    cx.setLineDash([]);
    if (snipX > CUT[0][0]) {
      cx.strokeStyle = 'rgba(18,12,8,.95)'; cx.lineWidth = 3.2;

// spilled items: final positions in MAIN-PAGE screen coords, launched from the skull at their cue; each has its own action
const SPILL = [
  { n: 'rocket', t: C.rocket, F: [1300, 204], r: 0.62, mode: 'launch', id: 31, drift: [26, -20] },
  { n: 'earth', t: C.earth, F: [712, 168], r: -0.22, r0: 1.1, arc: -330, mode: 'lob', id: 32 },
  { n: 'bird_hawk', t: C.birds[0], F: [1560, 196], r: -0.10, r0: 0.35, mode: 'swoop', id: 33 },
  { n: 'rose_centi', t: C.roses, F: [668, 560], r: -0.34, r0: -0.05, mode: 'grow', ay: 0.93, id: 36 },
  { n: 'rose_purple', t: C.roses + 1 / 12, F: [1040, 560], r: 0.42, r0: 0.05, mode: 'grow', ay: 0.95, id: 37 },
  { n: 'bfly_a', t: C.butterflies, F: [1196, 404], r: 0.25, r0: -0.8, arc: -150, mode: 'flutter', id: 38 },
  { n: 'bfly_b', t: C.butterflies + 1 / 12, F: [196, 150], r: -0.3, r0: 0.6, arc: -170, mode: 'flutter', id: 39 },
];
const MOUTH = [PL.head_center[0], PL.cut[3][1] + 10];
const bez = (a, b, c, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c;
function puff(c, x, y, r, seed, tl) {                     // cut-paper smoke puff

function drawSpill(c, t, it, tl = t) {

    x = lerp(M[0], Fl[0], u); y = lerp(M[1], Fl[1], u);

}

const shadeV = v => {                                         // verso quarter: v = 1 at the crest (grazing, dark) -> 0 where it rolls flat

  if (v > 0.2) return `rgba(255,248,232,${(0.40 * clamp(1 - Math.abs(v - 0.52) / 0.34)).toFixed(3)})`;
