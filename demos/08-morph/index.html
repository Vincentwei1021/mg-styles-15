<script>
(async function () {
const W = 1920, H = 1080, FPS = 30, FR = 1 / FPS;

const cues = await (await fetch('/demos/08-morph/cues.json')).json();

// reel v5 (only with ?v5=1): the end wordmark becomes the style name 形变动画, window.linkAt(t), ?nolink=dot,title
const QS = new URLSearchParams(location.search), V5 = QS.get('v5') === '1';
const NOLINK = new Set(V5 ? (QS.get('nolink') || '').split(',').map(s => s.trim()).filter(Boolean) : []);

const C = { ink: '#16151B', cream: '#F4EEE3', mari: '#FFB627', verm: '#FF4F2B', ultra: '#2438E8' };

// ---------------------------------------------------------------- math / easing / colour
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x, lerp = (a, b, t) => a + (b - a) * t;

const qT = x => Math.round(x * FPS) / FPS, SH = 0.5 / FPS;   // frame-centre time (identical for every harness mb sample) + the 0.5 shutter (s)
const EXI = x => x <= 0 ? 0 : x >= 1 ? 1 : (Math.pow(2, 10 * x) - 1) / 1023;   // expo-in
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-7) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return sy(t); };
}
const EM = bez(0.7, 0, 0.3, 1);          // the morph curve from the brief
const EO = bez(0.16, 1, 0.3, 1);         // expo-out (field blooms, arrivals)
const EIO = bez(0.45, 0, 0.55, 1);
const EB = bez(0.42, 0, 0.12, 1);          // field bloom
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const toLin = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
const toSrgb = c => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
function oklab(h) { const [r, g, b] = hexRgb(h).map(toLin);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s]; }
function fromOklab([L, a, b]) {
  const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3), m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3), s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
  const r = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, g = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, bb = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  return '#' + [r, g, bb].map(c => Math.round(clamp(toSrgb(clamp(c))) * 255).toString(16).padStart(2, '0')).join(''); }
const mixC = (h1, h2, t) => t <= 0 ? h1 : t >= 1 ? h2 : fromOklab(oklab(h1).map((v, i) => lerp(v, oklab(h2)[i], t)));
const tone = (h, dL) => { const A = oklab(h); A[0] += dL; return fromOklab(A); };

// ---------------------------------------------------------------- geometry
const NB = 240, NH = 72, NM = 24, NS = 60;
const svg = document.getElementById('svg');
function sampleD(d, n, closed = true) {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); svg.appendChild(p);
  const L = p.getTotalLength(), o = [], den = closed ? n : n - 1;
  for (let i = 0; i < n; i++) { const q = p.getPointAtLength(L * i / den); o.push([q.x, q.y]); }
  svg.removeChild(p); return o;
}
const area = P => { let a = 0; for (let i = 0; i < P.length; i++) { const p = P[i], q = P[(i + 1) % P.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };
const orient = P => area(P) < 0 ? P.slice().reverse() : P;
const centroid = P => { let x = 0, y = 0; for (const p of P) { x += p[0]; y += p[1]; } return [x / P.length, y / P.length]; };
function resamplePoly(P, n) {
  const L = [0]; for (let i = 1; i <= P.length; i++) { const a = P[i - 1], b = P[i % P.length]; L.push(L[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
  const tot = L[P.length], o = []; let j = 0;
  for (let i = 0; i < n; i++) { const s = tot * i / n; while (L[j + 1] < s) j++; const a = P[j], b = P[(j + 1) % P.length], u = (s - L[j]) / ((L[j + 1] - L[j]) || 1); o.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]); }
  return o;
}
const circ = (cx, cy, r, n) => Array.from({ length: n }, (_, i) => { const a = 2 * Math.PI * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
function bestShift(A, B) { const n = A.length; let best = Infinity, bs = 0;
  for (let s = 0; s < n; s++) { let e = 0; for (let i = 0; i < n; i += 2) { const b = B[(i + s) % n], dx = A[i][0] - b[0], dy = A[i][1] - b[1]; e += dx * dx + dy * dy; if (e >= best) break; } if (e < best) { best = e; bs = s; } }
  return bs; }
const shiftP = (B, s) => B.map((_, i) => B[(i + s) % B.length]);
const alignTo = (A, B) => shiftP(B, bestShift(A, B));
const lerpP = (A, B, t) => A.map((a, i) => [lerp(a[0], B[i][0], t), lerp(a[1], B[i][1], t)]);
const rep = (p, n) => Array.from({ length: n }, () => [p[0], p[1]]);
const S = d => orient(sampleD(d, NB));
function rpoly(pts, r) { const n = pts.length; let d = '';
  for (let i = 0; i < n; i++) { const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n], rr = Array.isArray(r) ? r[i] : r;
    const da = Math.hypot(a[0] - p[0], a[1] - p[1]), db = Math.hypot(b[0] - p[0], b[1] - p[1]), k1 = Math.min(rr, da / 2) / da, k2 = Math.min(rr, db / 2) / db;
    d += (i ? 'L' : 'M') + (p[0] + (a[0] - p[0]) * k1) + ',' + (p[1] + (a[1] - p[1]) * k1) + 'Q' + p[0] + ',' + p[1] + ' ' + (p[0] + (b[0] - p[0]) * k2) + ',' + (p[1] + (b[1] - p[1]) * k2); }
  return d + 'Z'; }
const strokeD = (d, w) => ({ pts: sampleD(d, NM, false), w });
const ray = (a, r1, r2, w, cx = 0, cy = 0) => { const c = Math.cos(a * deg), s = Math.sin(a * deg); return strokeD(`M${cx + r1 * c},${cy + r1 * s}L${cx + r2 * c},${cy + r2 * s}`, w); };
const dotS = p => ({ pts: rep(p, NM), w: 0 });
const hole = (pts, on = true) => ({ pts, on });
const noHole = p => hole(rep(p, NH), false);
const noShade = p => ({ pts: rep(p, NS), on: false });
function trim(pts, f) { // keep the first fraction f of an open polyline
  return pts.map((_, i) => { const u = i / (NM - 1) * f * (NM - 1), k = Math.min(NM - 2, Math.floor(u)), r = u - k; return [lerp(pts[k][0], pts[k + 1][0], r), lerp(pts[k][1], pts[k + 1][1], r)]; }); }

  I.sunset = { body: circ(0, 40, 150, NB), holes: [noHole([0, 40])], strokes: st, shade: noShade([0, 40]), fill: C.mari, pos: [960, 520], scale: 1, piv: [0, 40] };
}
{ // GULL — two crescent wings whose upper edges are arcs of the SUN's own circle (r 125); flapping
  const arcP = (a, b, R, n) => { const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy), h = Math.sqrt(Math.max(0, R * R - L * L / 4));
    let nx = -dy / L, ny = dx / L; if (ny < 0) { nx = -nx; ny = -ny; }
    const c = [mx + nx * h, my + ny * h], a0 = Math.atan2(a[1] - c[1], a[0] - c[0]); let da = Math.atan2(b[1] - c[1], b[0] - c[0]) - a0;
    while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    return Array.from({ length: n }, (_, i) => [c[0] + R * Math.cos(a0 + da * i / (n - 1)), c[1] + R * Math.sin(a0 + da * i / (n - 1))]); };
  const gp = ty => { const TL = [-205, ty], TR = [205, ty];
    return [...arcP(TL, [-13, 12], 125, 48), [0, 18], ...arcP([13, 12], TR, 125, 48), ...arcP(TR, [21, 40], 250, 48).slice(1),
      ...Array.from({ length: 13 }, (_, i) => [21 * Math.cos(Math.PI * (i + 1) / 14), 40 + 21 * Math.sin(Math.PI * (i + 1) / 14)]), ...arcP([-21, 40], TL, 250, 48).slice(0, -1)]; };
  const up = orient(resamplePoly(gp(-62), NB));
  const dn = alignTo(up, orient(resamplePoly(gp(40), NB)));
  I.gull = { body: up, down: dn, holes: [noHole([0, 20])], strokes: Array.from({ length: 8 }, () => dotS([0, 22])), shade: noShade([0, 20]), fill: C.cream, pos: [960, 424], scale: 1.02, piv: [0, 0] };
}
{ // PAPER PLANE — nose up-right (heading -35deg), keel facet
  const N = [205, -125], L = [-205, 5], F = [-40, 45], K = [-5, 160], Q = [F[0] + 0.32 * (N[0] - F[0]), F[1] + 0.32 * (N[1] - F[1])];
  const body = S(rpoly([N, L, F, K], [19, 19, 19, 19]));

    fill: C.cream, shadeC: mixC(C.cream, C.ultra, 0.30), pos: [690, 642], scale: 0.74, rot0: 35 * deg, piv: [0, 0] };
}
{ // PIN — circle + rotated square (the heart's own construction), eye = THE circle (r 22 px), fold facet = the plane's facet
  const R = 140, cy = -3, v = cy + R * Math.SQRT2, t = R / Math.SQRT2, q = 14 / 0.85 / Math.SQRT2;
  const body = S(`M ${-q},${v - q} L ${-t},${cy + t} A ${R},${R} 0 1 1 ${t},${cy + t} L ${q},${v - q} Q 0,${v} ${-q},${v - q} Z`);
  const shade = orient(sampleD(rpoly([[0, v + 4], [t + 2, cy + t], [0, cy]], [2, 2, 2]), NS));
  I.pin = { body, holes: [hole(circ(0, cy, 22 / 0.85, NH))], strokes: Array.from({ length: 8 }, () => dotS([0, cy])), shade: { pts: shade, on: true }, shadeC: '#D93A1C',

}

  const a = 234, h = a / Math.SQRT2, rc = a / 2, yc = 6, q = 14 / 0.86 / Math.SQRT2;
  const body = S(`M ${-q},${yc + h - q} L ${-h},${yc} A ${rc},${rc} 0 0 1 0,${yc - h} A ${rc},${rc} 0 0 1 ${h},${yc} L ${q},${yc + h - q} Q 0,${yc + h} ${-q},${yc + h - q} Z`);
  I.heart = { body, holes: [noHole([0, 0])], strokes: Array.from({ length: 8 }, () => dotS([0, 0])), shade: { pts: orient(sampleD(rpoly([[0, yc + h + 4], [h + 2, yc], [0, yc]], [2, 2, 2]), NS)), on: true },
    shadeC: mixC(C.cream, C.verm, 0.15), fill: C.cream, pos: [960, 522], scale: 0.86, piv: [0, 0] };
}

// ---------------------------------------------------------------- wordmark (real Outfit SemiBold outlines)
const WM = (() => {
  const FS = 250, s = FS / GL.upm, track = -5, yB = 566, word = 'morphe';
  const advs = [...word].map(ch => GL.glyphs[ch].adv * s);
  const dotR = 22, dotGap = 9;
  const total = advs.reduce((a, b) => a + b, 0) + track * (word.length - 1) + dotGap + 2 * dotR;
  let x = 960 - total / 2; const letters = [];
  [...word].forEach((ch, k) => {
    const g = GL.glyphs[ch]; const cs = g.contours.map(c => c.map(([gx, gy]) => [x + gx * s, yB - gy * s]));
    let oi = 0; g.areas.forEach((a, i) => { if (Math.abs(a) > Math.abs(g.areas[oi])) oi = i; });
    const outer = orient(resamplePoly(cs[oi], k === 0 ? NB : 200));
    const holes = cs.filter((_, i) => i !== oi).map(c => orient(resamplePoly(c, NH)));
    const cen = centroid(outer), ar = Math.abs(area(outer));
    letters.push({ ch, outer, holes, cen, r: Math.sqrt(ar / Math.PI) * 0.82, right: x + advs[k] });
    x += advs[k] + track;
  });
  const e = letters[letters.length - 1];
  const dot = { cen: [e.right + dotGap + dotR - track, yB - dotR], r: dotR };
  return { letters, dot, yB, FS };
})();
{ const m = WM.letters[0];
  I.m = { body: m.outer.map(p => [p[0] - m.cen[0], p[1] - m.cen[1]]), holes: [noHole([0, 0])], strokes: Array.from({ length: 8 }, () => dotS([0, 0])), shade: noShade([0, 0]),
    fill: C.cream, pos: m.cen, scale: 1, piv: [0, WM.yB - m.cen[1]] }; }

// ---------------------------------------------------------------- v5 title 形变动画 (real ResourceHanRounded Heavy outlines = morph targets)
// heart -> circle (8.30, at the title centre) -> the circle divides into four cells + the full stop -> each cell blooms into its character
let TV = null;
// v5.1 glyphs: 形变动画 constructed from the film's vocabulary: round-cap bars of ONE width (the icons' strokes), arcs for the
// falling strokes, true discs for the dots (the full stop's size), 画's 田 as one disc quartered (the four cells). Design px in a
// 240 box, y down; returned in the old font-JSON shape (upm 240, y up) so the bloom build below is unchanged.
function buildGV51() {
  const w = 32, hw = w / 2, BASE = 218;

  const arcC = (cx, cy, R, a0, a1, n = 40) => Array.from({ length: n }, (_, i) => { const a = (a0 + (a1 - a0) * i / (n - 1)) * deg; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  const arc3 = (p0, p1, sg, n = 40) => {   // arc p0 -> p1 with sagitta sg (+ = bulges to the right of the travel direction on screen)
    const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2, dx = p1[0] - p0[0], dy = p1[1] - p0[1], c = Math.hypot(dx, dy), nx = -dy / c, ny = dx / c;
    return Array.from({ length: n }, (_, i) => { const u = i / (n - 1), b = 4 * sg * u * (1 - u);   // parabola ~ arc for small sagitta
      return [p0[0] + dx * u + nx * b, p0[1] + dy * u + ny * b]; }); };
  const stroke = (...segs) => {   // centreline (tangent-continuous segments) -> closed outline with round caps
    const P = []; for (const sg of segs) for (const p of sg) { const q = P[P.length - 1]; if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) > 1e-6) P.push(p); }
    const n = P.length, Lf = [], Rt = [], tan = i => { const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)], d = Math.hypot(b[0] - a[0], b[1] - a[1]); return [(b[0] - a[0]) / d, (b[1] - a[1]) / d]; };
    for (let i = 0; i < n; i++) { const [tx, ty] = tan(i); Lf.push([P[i][0] - ty * hw, P[i][1] + tx * hw]); Rt.push([P[i][0] + ty * hw, P[i][1] - tx * hw]); }
    const cap = (c, t, a0, a1) => { const th = Math.atan2(t[1], t[0]), o = []; for (let j = 1; j < 16; j++) { const a = th + (a0 + (a1 - a0) * j / 16) * deg; o.push([c[0] + hw * Math.cos(a), c[1] + hw * Math.sin(a)]); } return o; };
    return [...Lf, ...cap(P[n - 1], tan(n - 1), 90, -90), ...Rt.reverse(), ...cap(P[0], tan(0), -90, -270)]; };
  const bar = (...a) => stroke(L2(...a));
  const disc = (cx, cy, r) => circ(cx, cy, r, 96);
  const quarters = (cx, cy, R, g) => [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([sx, sy]) => {   // a disc cut into four by a cross of width g
    const h = g / 2, e = Math.sqrt(R * R - h * h), aY = Math.atan2(sy * h, sx * e), aX = Math.atan2(sy * e, sx * h); let da = aX - aY;
    while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    return [[cx + sx * h, cy + sy * h], ...Array.from({ length: 33 }, (_, i) => [cx + R * Math.cos(aY + da * i / 32), cy + R * Math.sin(aY + da * i / 32)])]; });
  const G = {

    '变': [disc(120, 18, 19), bar(22, 58, 218, 58), bar(98, 58, 98, 102), bar(142, 58, 142, 102), disc(50, 104, 17), disc(190, 104, 17),
           bar(58, 150, 178, 150), stroke(arc3([178, 150], [38, 224], -14)), stroke(arc3([86, 172], [210, 224], 10))],
