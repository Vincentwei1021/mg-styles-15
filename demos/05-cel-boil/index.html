<html>
<head>
<meta charset="utf-8">
<title>05 · 手作 — cel animation / line boil</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: #f4e9d0; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
<script type="importmap">{"imports":{
  "simplex-noise":"/node_modules/simplex-noise/dist/esm/simplex-noise.js",
  "opentype":"/node_modules/opentype.js/dist/opentype.mjs"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { init, render, W, H, FPS, V5, linkAt } from './js/scene.js';
  window.DEMO = { width: W, height: H, fps: FPS, duration: 10, motionBlur: { samples: 1, shutter: 0.5 } };
  (async () => {
    await document.fonts.load('64px "LXGW Marker Gothic"', '星火牌安全火柴');
    await document.fonts.load('600 34px "Caveat"', 'No. 0123456789 on 1s 2s 3s SC.');
    await document.fonts.load('700 80px "Caveat"', 'No. 0123456789');
    await document.fonts.load('74px "Long Cang"', '张');
    await document.fonts.ready;
    await init(document.getElementById('c'), window.devicePixelRatio || 1);
    window.renderAt = async (t) => { render(t); };
    if (V5) window.linkAt = linkAt; // reel v5: link elements (pure function of t)
    render(0);
    window.__ready = true;
  })().catch((e) => { console.error('init failed', e && e.stack || e); });
</script>
</body>
</html>
